name: UI smoke checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse all JavaScript modules and workers
        shell: bash
        run: |
          set -euo pipefail
          for source in site/assets/*.js; do
            cp "$source" "$RUNNER_TEMP/$(basename "$source").mjs"
            node --check "$RUNNER_TEMP/$(basename "$source").mjs"
          done
      - name: Verify core UI contracts and local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("site")
          for page in ("index.html", "lesson.html", "claim.html"):
              html = (root / page).read_text()
              assert 'class="skip-link"' in html
              assert 'id="theme-toggle"' in html
              assert 'href="assets/style.css"' in html
              assert 'href="assets/favicon.svg"' in html
          for asset in ("style.css","favicon.svg","theme.js","home.js","notebook.js","claim.js","py-worker.js","app.js"):
              assert (root / "assets" / asset).is_file(), asset
          print("UI assets and navigation verified")
          PY

name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/python-notebook
          path: course
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          python -m pip install markdown pytest
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Build
        run: python build/build_site.py --course course --out dist
      - name: Build checks
        run: COURSE=course python -m pytest tests -q
      - name: End-to-end in Chromium
        run: node tests/e2e.cjs

name: Learning platform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_staging:
        type: boolean
        default: false
        description: Deploy and verify the staging Worker
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pull requests and pushes build against the course revisions pinned in
      # build/upstream.json, so an upstream change can't break unrelated PRs.
      # The nightly run uses every course's latest main to report drift early.
      - name: Resolve course revisions
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          pins = json.load(open("build/upstream.json"))
          latest = os.environ["EVENT"] == "schedule"
          for repo, sha in pins.items():
              if not repo.startswith("_"):
                  print(f"{repo.replace('-', '_')}={'' if latest else sha}")
          PY
        env:
          EVENT: ${{ github.event_name }}
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/python-notebook
          ref: ${{ steps.pins.outputs.python_notebook }}
          path: course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/SQL
          ref: ${{ steps.pins.outputs.SQL }}
          path: sql-course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/git-github-course
          ref: ${{ steps.pins.outputs.git_github_course }}
          path: git-course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/RUST
          ref: ${{ steps.pins.outputs.RUST }}
          path: rust-course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/linux-course
          ref: ${{ steps.pins.outputs.linux_course }}
          path: linux-course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/Data-Structures-Algorithms
          ref: ${{ steps.pins.outputs.Data_Structures_Algorithms }}
          path: dsa-course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/C
          ref: ${{ steps.pins.outputs.C }}
          path: c-course
      - uses: actions/checkout@v4
        with:
          repository: SwarmLadder/Java
          ref: ${{ steps.pins.outputs.Java }}
          path: java-course
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: make -C java-course reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install markdown pytest
      - run: npm ci
      - run: python build/prepare.py --course course --sql-course sql-course --git-course git-course --rust-course rust-course --linux-course linux-course --dsa-course dsa-course --c-course c-course --java-course java-course
      - run: COURSE=course SQL_COURSE=sql-course GIT_COURSE=git-course RUST_COURSE=rust-course LINUX_COURSE=linux-course DSA_COURSE=dsa-course C_COURSE=c-course JAVA_COURSE=java-course python -m pytest tests -q
      - run: npm test
      - run: npm run build
        env:
          COURSE: course
          SQL_COURSE: sql-course
          GIT_COURSE: git-course
          RUST_COURSE: rust-course
          LINUX_COURSE: linux-course
          DSA_COURSE: dsa-course
          C_COURSE: c-course
          JAVA_COURSE: java-course
      - run: npx playwright install --with-deps chromium
      - name: Verify Java browser flow independently
        run: npx playwright test tests/browser/java.spec.ts
      - run: npm run test:e2e
      # Deploy only after every check passes. PRs never receive deployment credentials.
      - name: Deploy verified staging build
        id: staging-deploy
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.deploy_staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Staging deployment skipped. Configure the Cloudflare GitHub Actions variables and secret."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run deploy:staging
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Test deployed staging site
        if: steps.staging-deploy.outputs.deployed == 'true'
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://swarmladder-lab-staging.bitpyrus.workers.dev' }}
        run: npm run test:e2e
